workflows:
  android-debug:
    name: QtexAIAnalyzer Android APK
    instance_type:mac_mini_M2
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk