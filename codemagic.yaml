workflows:
  android-debug:
    name: QtexAIAnalyzer Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
