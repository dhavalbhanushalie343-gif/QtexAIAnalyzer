workflows:
  android-debug:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Setup Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
